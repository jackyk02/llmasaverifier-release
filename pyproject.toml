[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-verifier"
version = "0.1.0"
description = "A general-purpose LLM verification framework: fine-grained reward + Pivot Preference Tournament best-of-N selection."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai",
    "tqdm",
]

[tool.setuptools]
packages = ["llm_verifier"]

[tool.setuptools.package-data]
llm_verifier = ["criteria/*.md"]
